<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Largest element in array</title>
</head>
<body>
    <h3>Find the Largest element in array</h3>
</body>
<script>

let arr = [1,3,4,0,5,2,4,7,4,8]

let Largest = arr[0]

for(let i = 0; i< arr.length; i++){

if(arr[i] > Largest){

    Largest = arr[i]
}
}
console.log("Largest element :",Largest)

</script>
</html>
