<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find second largest element</title>
</head>
<body>
    Find second largest element

    <input type="text" id="sec" text: disabled>

</body>
<script>
    let sec = document.getElementById("sec")
    let arr = [4,2,1,3,6,7,3,3,9]

    let largest = arr[0]

    let second = null

    for(let i = 0; i < arr.length; i++){

     if(arr[i] > largest){

       second = largest;
       largest = arr[i]

     }else if( arr[i]> second){
        second = arr[i]
     }
    }
    sec.value = second;
    console.log(second)
</script>
</html>
