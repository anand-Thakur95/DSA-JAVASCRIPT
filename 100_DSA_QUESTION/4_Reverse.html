<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse an array</title>
</head>
<body>
    <h1>Reverse an array</h1>
</body>
<script>
    
    let arr = [2,3,1,7,8,5,4,9]
    for(let i = 0; i < arr.length; i++){

        for(let j = 0; j <arr.length-1; j++){

         if(arr[j] > arr[j+1]){

            let temp = arr[j];
            arr[j] = arr[j + 1];
            arr[j + 1] = temp;
        }

          }     
    }

    let Reverse = []

    for(let i=arr.length-1; i >=0; i--){
    Reverse.push(arr[i])

    }
    console.log(arr)

    console.log(Reverse)
</script>
</html>
