<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move All Zero to End</title>
</head>
<body>
    <script>
        function moveAllZeroToEnd(arr) {
            let result = [];
            for (let i = 0; i < arr.length; i++) {
                if(arr[i] !== 0) {
                    result.push(arr[i]);
                } 
                 }
                 for (let i = 0; i < arr.length; i++) {
                    if(arr[i] === 0) {
                        result.push(0);
                    }
                }
                return result;
            }
        
        console.log(moveAllZeroToEnd([0, 0, 0,1, 2, 3, 4, 5]));
        

    </script>
</body>
</html>
