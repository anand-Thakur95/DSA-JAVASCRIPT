<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Duplicate</title>
</head>
<body>
    <h3>Find Duplicate</h3>
</body>
<script>
    function findDuplicate(arr) {

        let duplicates = [];

        let n = arr.length;
        for (let i = 0; i < n; i++){
            for (let j = i + 1; j < n; j++){
                if (arr[i] === arr[j]) {
                if (!duplicates.includes(arr[i])) {
                    duplicates.push(arr[i]);
                }
                }

            }

        }
        return duplicates;
    }
    console.log(findDuplicate([1, 2, 3,2,3, 4, 5, 6, 7, 8, 9, 10]));
</script>
</html>
